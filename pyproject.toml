[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-keplergl"
version = "0.4.0"
description = "Streamlit Component for rendering kepler.gl maps"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Christoph Rieke" }]
requires-python = ">=3.10"
dependencies = ["streamlit>=1.0", "keplergl"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/chrieke/streamlit-keplergl"

[tool.setuptools.packages.find]
include = ["streamlit_keplergl*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]  # pycodestyle, pyflakes, import sorting
