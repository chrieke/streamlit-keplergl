name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keplergl 0.3.7 build-requires pyarrow~=16.0.0, which has no wheels for 3.13+.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # keplergl is sdist-only and its build deps import pkg_resources,
        # which setuptools dropped in 81.
        run: |
          echo "setuptools<81" > /tmp/constraints.txt
          PIP_CONSTRAINT=/tmp/constraints.txt pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -v
